<svg xmlns="http://www.w3.org/2000/svg" width="940" height="372" viewBox="0 0 940 372" font-family="Helvetica, Arial, sans-serif">
<rect width="940" height="372" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker></defs>
<text x="470" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">One Bad Document, Two Failure Stories</text>
<rect x="20" y="54" width="430" height="252" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="235" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">One run over the whole corpus</text>
<text x="235" y="101" text-anchor="middle" font-size="11" fill="#64748b">for doc in docs: ...</text>
<rect x="46" y="128" width="378" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="235" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">a single run</text>
<rect x="50" y="164" width="46" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="73" y="181" text-anchor="middle" font-size="9.5" fill="#64748b">doc</text>
<rect x="104" y="164" width="46" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="127" y="181" text-anchor="middle" font-size="9.5" fill="#64748b">doc</text>
<rect x="158" y="164" width="46" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="181" y="181" text-anchor="middle" font-size="9.5" fill="#64748b">doc</text>
<rect x="212" y="164" width="46" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="235" y="181" text-anchor="middle" font-size="9.5" fill="#7f1d1d">bad</text>
<rect x="266" y="164" width="46" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="289" y="181" text-anchor="middle" font-size="9.5" fill="#64748b">doc</text>
<rect x="320" y="164" width="46" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="343" y="181" text-anchor="middle" font-size="9.5" fill="#64748b">doc</text>
<rect x="374" y="164" width="46" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="397" y="181" text-anchor="middle" font-size="9.5" fill="#64748b">doc</text>
<text x="235" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">the exception ends the run</text>
<text x="235" y="252" text-anchor="middle" font-size="11.5" fill="#475569">Every document after it is never processed.</text>
<text x="235" y="270" text-anchor="middle" font-size="11.5" fill="#475569">Recovery means running the whole corpus again.</text>
<rect x="490" y="54" width="430" height="252" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="705" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">One run per document</text>
<text x="705" y="101" text-anchor="middle" font-size="11" fill="#64748b">ingest_corpus sends 5,000 events</text>
<rect x="620" y="118" width="170" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="705" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0c4a6e">ingest_corpus</text>
<line x1="705" y1="156" x2="561" y2="176" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="530" y="180" width="62" height="34" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="561" y="201" text-anchor="middle" font-size="9.5" fill="#064e3b">run</text>
<line x1="705" y1="156" x2="633" y2="176" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="602" y="180" width="62" height="34" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="633" y="201" text-anchor="middle" font-size="9.5" fill="#064e3b">run</text>
<line x1="705" y1="156" x2="705" y2="176" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="674" y="180" width="62" height="34" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="705" y="201" text-anchor="middle" font-size="9.5" fill="#7f1d1d">fails</text>
<line x1="705" y1="156" x2="777" y2="176" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="746" y="180" width="62" height="34" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="777" y="201" text-anchor="middle" font-size="9.5" fill="#064e3b">run</text>
<line x1="705" y1="156" x2="849" y2="176" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="818" y="180" width="62" height="34" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="849" y="201" text-anchor="middle" font-size="9.5" fill="#064e3b">run</text>
<line x1="705" y1="218" x2="705" y2="240" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="639" y="244" width="132" height="28" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="705" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f1d1d">review queue</text>
<text x="705" y="292" text-anchor="middle" font-size="11.5" fill="#475569">The other 4,999 runs retry on their own and finish.</text>
<line x1="20" y1="330" x2="920" y2="330" stroke="#e2e8f0" stroke-width="1"/>
<text x="470" y="352" text-anchor="middle" font-size="12.5" fill="#0f172a">Fan-out buys 5,000 runs that succeed, fail and retry independently. It costs you the caller's return value.</text>
</svg>
