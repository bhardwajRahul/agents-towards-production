<svg xmlns="http://www.w3.org/2000/svg" width="940" height="396" viewBox="0 0 940 396" font-family="Helvetica, Arial, sans-serif">
<rect width="940" height="396" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="470" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">What a Retry Replays</text>
<text x="470" y="52" text-anchor="middle" font-size="12" fill="#475569">One document, one function run, wrapped in ctx.step.run()</text>
<text x="88" y="72" font-size="11.5" font-weight="bold" fill="#64748b">ATTEMPT 1</text>
<rect x="88" y="82" width="140" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="158" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">fetch</text>
<text x="158" y="122" text-anchor="middle" font-size="10.5" fill="#064e3b">runs, result saved</text>
<rect x="244" y="82" width="140" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="314" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">parse</text>
<text x="314" y="122" text-anchor="middle" font-size="10.5" fill="#064e3b">runs, result saved</text>
<rect x="400" y="82" width="140" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="470" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">chunk</text>
<text x="470" y="122" text-anchor="middle" font-size="10.5" fill="#064e3b">runs, result saved</text>
<rect x="556" y="82" width="140" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="626" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">embed</text>
<text x="626" y="122" text-anchor="middle" font-size="10.5" fill="#064e3b">runs, result saved</text>
<rect x="712" y="82" width="140" height="52" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="782" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">upsert</text>
<text x="782" y="122" text-anchor="middle" font-size="10.5" fill="#7f1d1d">fails, the index write times out</text>
<rect x="88" y="174" width="764" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">Inngest state store</text>
<text x="470" y="210" text-anchor="middle" font-size="11" fill="#475569">the return value of fetch, parse, chunk and embed, keyed by step ID</text>
<line x1="470" y1="138" x2="470" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="470" y1="224" x2="470" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
<text x="88" y="250" font-size="11.5" font-weight="bold" fill="#64748b">ATTEMPT 2</text>
<rect x="88" y="260" width="140" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="158" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">fetch</text>
<text x="158" y="300" text-anchor="middle" font-size="10.5" fill="#334155">replayed, does not run</text>
<rect x="244" y="260" width="140" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="314" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">parse</text>
<text x="314" y="300" text-anchor="middle" font-size="10.5" fill="#334155">replayed, does not run</text>
<rect x="400" y="260" width="140" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">chunk</text>
<text x="470" y="300" text-anchor="middle" font-size="10.5" fill="#334155">replayed, does not run</text>
<rect x="556" y="260" width="140" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="626" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">embed</text>
<text x="626" y="300" text-anchor="middle" font-size="10.5" fill="#334155">replayed, does not run</text>
<rect x="712" y="260" width="140" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="782" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">upsert</text>
<text x="782" y="300" text-anchor="middle" font-size="10.5" fill="#064e3b">runs for real</text>
<line x1="88" y1="324" x2="852" y2="324" stroke="#e2e8f0" stroke-width="1"/>
<text x="88" y="342" font-size="12.5" fill="#0f172a">The embed step returns its vector from the store, so the embedding call is billed <tspan font-weight="bold">once</tspan>, not once per attempt.</text>
</svg>
